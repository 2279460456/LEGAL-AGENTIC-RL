# LLM Evidence Split Configuration
# 用于GRPO数据集构建中的证据拆分

# ============================================================================
# DeepSeek API 配置 (2026/05更新)
# ============================================================================

llm:
  # 是否启用LLM拆分（设为true后需要配置api_key）
  enabled: true

  # DeepSeek模型名称
  # - deepseek-v4-flash: 快速模型，非思考模式
  # - deepseek-v4-pro: 高级模型，支持思考模式
  # 注意: deepseek-chat将于2026/07/24弃用
  model: "deepseek-v4-flash"

  # API密钥（请替换为您自己的key）
  # 获取方式: https://platform.deepseek.com/
  api_key: "sk-e227180049ad4ea09f8ce2184c546ea7"  # 或设置环境变量 DEEPSEEK_API_KEY

  # DeepSeek API端点 (OpenAI兼容格式)
  # 官方文档: https://api.deepseek.com/chat/completions
  api_endpoint: "https://api.deepseek.com/chat/completions"

  # 生成参数
  temperature: 0.3  # 低温度保证稳定JSON输出
  max_tokens: 800   # 增加token以适应JSON格式

  # 批处理配置
  batch_size: 10  # 每批处理数量
  retry_times: 3  # 失败重试次数
  retry_delay: 2.0  # 重试间隔（秒）

# ============================================================================
# 输出配置
# ============================================================================

output:
  # 数据输出路径
  train_output: "data/rl_env/train_cases.json"
  test_output: "data/rl_env/test_cases.json"

  # 训练/测试划分比例
  train_ratio: 0.8

# ============================================================================
# 数据筛选配置
# ============================================================================

data:
  # 输入数据路径
  input_path: "data/raw/judge-data/all.json"

  # 最大处理样本数（用于测试，设为null处理全部）
  max_samples: null

  # 最小Fact长度（过短的案件跳过）
  min_fact_length: 50

# ============================================================================
# 日志配置
# ============================================================================

logging:
  # 是否显示详细日志
  verbose: true

  # 日志输出路径
  log_file: "logs/llm_split.log"