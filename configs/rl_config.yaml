# RL Training Configuration (优化版 - 24GB显存)
# LEGAL-AGENTIC-RL Project
# 针对 RTX 3090/4090 (24GB) 优化

# GRPO Configuration
grpo:
  group_size: 4  # [调整] 增加到4，减少reward相同概率
  temperature: 0.9  # [调整] 提高到0.9，减少重复输出倾向
  top_p: 0.9  # Top-p sampling
  max_turns: 10  # Maximum conversation turns per episode
  early_stop_patience: 5  # Stop if no improvement for N epochs
  max_new_tokens: 128  # [调整] 从64增加到128，给模型更多生成空间
  do_sample: true

  # [新增] 上下文长度控制（防止上下文爆炸）
  max_prompt_tokens: 1200  # Prompt最大token数（为输出留空间）
  max_history_rounds: 3    # 保留最近N轮对话历史
  max_evidence_preview: 50 # 每个证据预览最大字数

  # [新增] 生成质量控制
  repetition_penalty: 1.1  # 重复惩罚系数（>1减少重复）

# Environment Configuration
environment:
  evidence_levels:
    - "subjective"  # Level 1: Motive, premeditation
    - "objective"   # Level 2: Action details, injury degree
    - "sentencing"  # Level 3: Confession, compensation
  trigger_method: "keyword"  # keyword or semantic
  max_rounds: 10  # 最大交互轮数

# Reward Configuration
reward:
  weights:
    accuracy: 0.5  # lambda_1
    information: 0.3  # lambda_2
    compliance: 0.2  # lambda_3
  accuracy:
    crime_weight: 0.4
    sentence_weight: 0.3
    law_weight: 0.3
  information:
    new_evidence_bonus: 0.1
    repeat_penalty: -0.05
    irrelevant_penalty: -0.02
  compliance:
    term_bonus: 0.02
    step_bonus: 0.05
    round_penalty: -0.1

# Training Configuration
training:
  learning_rate: 2e-5  # [调整] 从1e-5增加到2e-5，配合更大batch
  batch_size: 1  # Process one case at a time (GRPO天然batch=1)
  gradient_accumulation_steps: 1  # [新增] 不需要累积，显存足够
  num_episodes: 2000  # [调整] 从1000增加到2000
  eval_interval: 100  # [调整] 从50增加到100
  save_interval: 200  # [调整] 从100增加到200
  warmup_steps: 100  # [新增] warmup步数
  max_grad_norm: 1.0  # [新增] 梯度裁剪
  save_total_limit: 2  # [新增] 最多保留几个checkpoint（节省磁盘空间）

# Model Configuration
model:
  base_model: "Qwen/Qwen3-8B"
  sft_checkpoint: "models/sft_checkpoint"

  # LoRA配置
  lora:
    r: 64  # [新增] LoRA rank，24GB可用更大值
    lora_alpha: 128  # [新增] alpha = 2 * r
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]  # [新增] 目标模块
    lora_dropout: 0.05  # [新增] dropout率

  # 量化配置
  quantization:
    use_4bit: true  # [新增] 使用4bit量化
    bnb_4bit_quant_type: "nf4"  # [新增] NF4量化
    bnb_4bit_compute_dtype: "float16"  # [新增] 计算精度

  # 显存优化
  optimization:
    use_flash_attention: true  # [新增] Flash Attention 2加速
    use_gradient_checkpointing: true  # [修改] 启用gradient checkpointing节省显存
    max_memory:
      0: "20GB"  # [新增] GPU显存限制（YAML字典格式）

# Data Configuration
data:
  train_cases_path: "data/rl_env/train_cases_clean.json"
  test_cases_path: "data/rl_env/test_cases_clean.json"
  num_train_cases: 1000  # [调整] 清理后约890条高质量数据，这里设置1000足够
  num_test_cases: 200  # [调整] 清理后的测试数据量

# Output Configuration
output:
  output_dir: "models/rl_checkpoint"
  log_dir: "results/logs"
  run_name: "grpo_legal_agent_24g"
  save_total_limit: 3  # [新增] 最多保存3个checkpoint