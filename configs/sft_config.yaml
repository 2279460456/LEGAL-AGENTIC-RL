# SFT Training Configuration
# LEGAL-AGENTIC-RL Project

# ============================================================================
#方案一：标准LoRA（FP16，显存需求 >=16GB）
# 推荐优先使用，训练精度更高
# ============================================================================
# model:
#   base_model: "Qwen/Qwen3-8B"
#   # 无量化，原始精度加载

# ============================================================================
# 方案二：QLoRA（4-bit量化，显存需求 <16GB）
# 显存不足时使用
# ============================================================================
model:
  base_model: "Qwen/Qwen3-8B"
  use_4bit: true  # 4-bit quantization for memory efficiency
  use_double_quant: true
  quant_type: "nf4"

# LoRA Configuration
lora:
  r: 64  # LoRA rank
  lora_alpha: 16
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  lora_dropout: 0.05
  bias: "none"

# Training Configuration
training:
  learning_rate: 2e-4
  batch_size: 4
  gradient_accumulation_steps: 4
  num_epochs: 3
  max_seq_length: 2048
  warmup_ratio: 0.03
  weight_decay: 0.01
  logging_steps: 10
  save_steps: 100
  save_total_limit: 3

# Data Configuration
data:
  train_data_path: "data/processed"
  num_samples: 5000  # Target number of samples per role
  roles:
    - "prosecutor"
    - "defender"
    - "judge"

# Output Configuration
output:
  output_dir: "models/sft_checkpoint"
  run_name: "sft_qwen8b_legal_roles"